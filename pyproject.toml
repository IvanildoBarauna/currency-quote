[tool.poetry]
name = "currency-quote"
version = "6.0.0"
description = "Fetch currency pair quotes from the AwesomeAPI (economia) with typed results, flexible dates, retries, parity validation and an optional pandas exporter."
authors = ["IvanildoBarauna <ivanildo.jnr@outlook.com>"]
readme = "README.md"
license = "MIT"

classifiers=[
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]


[tool.poetry.urls]
Homepage = "https://github.com/IvanildoBarauna/currency-quote"
ArchDesign = "https://github.com/IvanildoBarauna/currency-quote/blob/main/hexagonal_design_arch.png"
Repository = "https://github.com/IvanildoBarauna/currency-quote"
README = "https://github.com/IvanildoBarauna/currency-quote/blob/main/README.md"
Issues = "https://github.com/IvanildoBarauna/currency-quote/issues"


[tool.poetry.dependencies]
python = "^3.9"
requests = ">=2.31,<4.0"
pandas = {version = ">=2.0,<4.0", optional = true}

[tool.poetry.extras]
pandas = ["pandas"]

[tool.poetry.group.dev.dependencies]
coverage = "^7.5.4"
pytest = "^8.2.2"
poetry-dynamic-versioning = "^1.3.0"
black = ">=24.4.2,<26.0.0"
pylint = "^3.2.5"
pandas = ">=2.0,<4.0"

[tool.poetry.scripts]
currency-quote = "currency_quote.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry-dynamic-versioning]
enable = true
versioning = "semantic"

[tool.black]

[tool.pylint.'MESSAGES CONTROL']
disable = [
    "C0114", # missing-module-docstring
    "C0116", # missing-function-docstring
    "R0903", # too-few-public-methods
    "R0913", # too-many-arguments
    "R0801", # duplicate-code: mirrored fixtures across test files by design
    "W0621", # redefined-outer-name: pytest fixtures look like redefinition
]
