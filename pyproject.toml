[tool.poetry]
name = "currency-quote"
version = "6.0.0"
description = "Lightweight Python client for current and historical AwesomeAPI currency exchange quotes."
authors = ["IvanildoBarauna <ivanildo.jnr@outlook.com>"]
readme = "README.md"
license = "MIT"
packages = [{include = "currency_quote", from = "src"}]
include = ["src/currency_quote/py.typed"]
keywords = ["currency", "exchange-rate", "forex", "quotes", "brazil", "awesomeapi"]

classifiers=[
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]


[tool.poetry.urls]
Homepage = "https://github.com/IvanildoBarauna/currency-quote"
ArchDesign = "https://github.com/IvanildoBarauna/currency-quote/blob/main/hexagonal_design_arch.png"
Repository = "https://github.com/IvanildoBarauna/currency-quote"
README = "https://github.com/IvanildoBarauna/currency-quote/blob/main/README.md"
Issues = "https://github.com/IvanildoBarauna/currency-quote/issues"


[tool.poetry.dependencies]
python = "^3.9"
requests = ">=2.32,<3"
pandas = {version = ">=2.0,<3", optional = true}
tzdata = {version = ">=2024.1", markers = "sys_platform == 'win32'"}

[tool.poetry.extras]
pandas = ["pandas"]

[tool.poetry.scripts]
currency-quote = "currency_quote.__main__:main"

[tool.poetry.group.dev.dependencies]
coverage = "^7.5.4"
pytest = "^8.2.2"
poetry-dynamic-versioning = "^1.3.0"
black = ">=24.4.2,<26.0.0"
pylint = "^3.2.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry-dynamic-versioning]
enable = true
versioning = "semantic"

[tool.black]

[tool.coverage.run]
source = ["currency_quote"]

[tool.pylint.'MESSAGES CONTROL']
disable = [
    "C0114", # missing-module-docstring
    "C0116", # missing-function-docstring
    "R0903", # too-few-public-methods
]
