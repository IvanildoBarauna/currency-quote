name: Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    uses: ivanildobarauna/github-workflows/.github/workflows/tests-python-poetry.yml@v1
    with:
      python-versions: '["3.9", "3.10", "3.11", "3.12", "3.13"]'
      environment: Development
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
