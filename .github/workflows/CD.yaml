name: Publish Python Package

on:
  pull_request:
    types: [closed]
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    uses: ivanildobarauna/github-workflows/.github/workflows/publish-python-package.yml@v1
    with:
      python-version: "3.9"
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
